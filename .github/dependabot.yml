version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Media3 1.10+ needs compileSdk 36 (see gradle/libs.versions.toml).
      - dependency-name: 'androidx.media3:*'
        versions: ['>= 1.10.0']
    groups:
      androidx-compose:
        patterns:
          - 'androidx.compose*'
      androidx:
        patterns:
          - 'androidx.*'
        exclude-patterns:
          - 'androidx.compose*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'org.jetbrains.kotlinx*'
          - 'com.google.devtools.ksp*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
