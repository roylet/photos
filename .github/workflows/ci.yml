name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches are written on the default branch and read everywhere else.
      - uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads its Android runtime jars from Maven Central at test time; cache them
      # so a flaky or rate-limited download can't fail the build.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Ensure Android SDK platform 37 / build-tools 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Lint, unit tests, debug APK
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest assembleDebug || ./gradlew --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: photos-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Render screenshots
        run: ./gradlew --stacktrace testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest*'

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: warn
          retention-days: 14
