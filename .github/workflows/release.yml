name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (tag v<version> is created on the selected commit)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # versionCode = run number + offset, so every release upgrades the previous one.
  VERSION_CODE_OFFSET: 1000

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing signing secrets::Missing repository secrets: ${missing[*]}. Add all 4 (RELEASE_KEYSTORE_BASE64 = base64 of the keystore file, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) under GitHub > ${GITHUB_REPOSITORY} > Settings > Secrets and variables > Actions > New repository secret, then re-run this workflow."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad version::'$version' is not a version like 1.2.3"
            exit 1
          fi
          code=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Robolectric downloads its Android runtime jars from Maven Central at test time; cache them
      # so a flaky or rate-limited download can't fail the build.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Ensure Android SDK platform 35 / build-tools 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" > /dev/null

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest || ./gradlew --stacktrace testDebugUnitTest

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --stacktrace assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs and checksums
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          out=app/build/outputs/apk/release
          mkdir dist
          cp "$out/app-arm64-v8a-release.apk" "dist/Photos-$VERSION-arm64-v8a.apk"
          cp "$out/app-universal-release.apk"  "dist/Photos-$VERSION-universal.apk"
          # Fail if the APKs were not signed with the release key (debug fallback).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/36.*/apksigner | tail -1)"
          if "$apksigner" verify --print-certs dist/*.apk | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with the debug key; check the signing secrets."
            exit 1
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Photos ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Photos-${{ steps.version.outputs.name }}-arm64-v8a.apk
            dist/Photos-${{ steps.version.outputs.name }}-universal.apk
            dist/SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
