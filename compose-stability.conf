// Compose compiler stability configuration (see app/build.gradle.kts, composeCompiler).
// Classes listed here are treated as stable: they are never mutated after construction, so
// Compose may compare them with equals() and skip recomposition when they are unchanged.
// Evidence: ./gradlew :app:compileReleaseKotlin -PcomposeReports (app/build/compose_reports).

// Editor recipe: immutable data classes; ColorAdjust and Curves hold read-only Lists, which the
// compiler can't prove immutable, making Recipe (and every composable taking one) "unstable".
com.roylet.photos.editor.recipe.Recipe
com.roylet.photos.editor.recipe.ColorAdjust
com.roylet.photos.editor.recipe.Curves

// Timeline layout: a row's widths (FloatArray) are computed once and never written again.
com.roylet.photos.domain.timeline.JustifiedRow

// URL builders for grid cells: pure functions of the (immutable) server config.
com.roylet.photos.ui.gallery.MediaUrls
